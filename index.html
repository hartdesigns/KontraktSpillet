<style>
/* ============================================================
   KONTRAKTKONTORET — designsystem "Sød men skarp"
   Farver, knapper, chips, talebobler og animationer
   ============================================================ */
:root{--paper:#eefaf4;--paper-dot:#cdebdc;--card:#ffffff;--line:#b9d9ca;--ink:#1d2b3a;--ink-muted:#4d5f6e;--berry:#c2185b;--berry-soft:#ffe0ec;--teal:#0b7477;--teal-soft:#d3f4f1;--butter:#ffd84d;--butter-soft:#fff4c2}
body{margin:0;font-family:Nunito,ui-rounded,system-ui,sans-serif;color:#1d2b3a;background:#eefaf4}
a{color:#c2185b}a:hover{color:#8e0f41}
.disp{font-family:Fredoka,"Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif}
.hand{font-family:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive}
button{font:inherit;color:inherit}
.btn{font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-weight:600;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border:3px solid #1d2b3a;border-radius:18px;box-shadow:4px 4px 0 #1d2b3a;cursor:pointer;transition:transform .08s ease,box-shadow .08s ease;background:#ffffff;color:#1d2b3a}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #1d2b3a}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #1d2b3a}
.btn:focus-visible,.chip:focus-visible,.icon-btn:focus-visible,.name-input:focus-visible{outline:3px solid #c2185b;outline-offset:3px}
.btn-go{background:#ffd84d;color:#1d2b3a}
.btn-berry{background:#c2185b;color:#ffffff}
.btn-teal{background:#0b7477;color:#ffffff}
.btn-big{font-size:24px;min-height:68px;padding:0 34px;border-radius:22px}
.btn[disabled]{background:#e3eee8;color:#4d5f6e;cursor:not-allowed;box-shadow:4px 4px 0 #9fb8ac;border-color:#9fb8ac;transform:none;animation:none}
.btn-go.ready{animation:nudge 1.6s ease-in-out infinite}
.icon-btn{width:48px;height:48px;border-radius:999px;border:3px solid #1d2b3a;background:#ffffff;box-shadow:3px 3px 0 #1d2b3a;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .08s}
.icon-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 #1d2b3a}
.chip{font-family:Nunito,ui-rounded,system-ui,sans-serif;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:6px 10px;border:3px solid #1d2b3a;border-radius:14px;background:#ffffff;color:#1d2b3a;box-shadow:3px 3px 0 #1d2b3a;cursor:pointer;transition:transform .12s cubic-bezier(.3,1.6,.5,1),background .12s}
.chip:hover{transform:translate(-1px,-2px) rotate(-1deg);background:#fff4c2}
.chip.on{background:#0b7477;color:#ffffff;transform:rotate(-1.5deg) scale(1.04);animation:chipPop .35s cubic-bezier(.3,1.8,.5,1)}
.chip svg{flex-shrink:0}
.name-input{width:100%;box-sizing:border-box;height:54px;border:3px solid #1d2b3a;border-radius:12px;padding:0 16px;font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:22px;font-weight:500;color:#1d2b3a;background:#ffffff;box-shadow:inset 0 -4px 0 #d3f4f1}
.name-input::placeholder{color:#6f7f8c}
.num{width:30px;height:30px;border-radius:999px;border:3px solid #1d2b3a;display:inline-flex;align-items:center;justify-content:center;font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:15px;background:#ffffff;flex-shrink:0;transition:background .2s}
.num.done{background:#0b7477;color:#ffffff;animation:chipPop .35s cubic-bezier(.3,1.8,.5,1)}
.lbl{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#4d5f6e}
.bubble{position:relative;background:#ffffff;border:3px solid #1d2b3a;border-radius:18px;box-shadow:4px 4px 0 #1d2b3a;padding:12px 16px;font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-size:18px;line-height:24px;font-weight:500}
.bubble.alert{background:#fff4c2}
.bubble.boss{background:#ffe0ec}
.bubble.tail-l::after{content:"";position:absolute;left:-13px;top:22px;width:18px;height:18px;background:inherit;border-left:3px solid #1d2b3a;border-bottom:3px solid #1d2b3a;transform:rotate(45deg);border-radius:0 0 0 4px}
.bubble.tail-b::after{content:"";position:absolute;left:48px;bottom:-13px;width:18px;height:18px;background:inherit;border-right:3px solid #1d2b3a;border-bottom:3px solid #1d2b3a;transform:rotate(45deg);border-radius:0 0 4px 0}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.popB{animation:popB .5s cubic-bezier(.3,1.6,.5,1) both}
.d1{animation-delay:.7s}.d2{animation-delay:1.3s}.d3{animation-delay:1.9s}
.wiggle{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both,wiggle .5s ease-in-out .5s 3}
.walkA{animation:walkA 1s cubic-bezier(.3,1.3,.5,1) both}
.walkB{animation:walkB 1s cubic-bezier(.3,1.3,.5,1) both}
.bob{animation:bob 1.8s ease-in-out infinite}
.bob2{animation:bob 1.8s ease-in-out .3s infinite}
.bob3{animation:bob 1.8s ease-in-out .6s infinite}
.kajIn{animation:kajIn .7s cubic-bezier(.3,1.5,.5,1) both}
.bo-in{animation:boIn .8s cubic-bezier(.3,1.4,.5,1) both}
.bo-tilt{animation:boTilt 1.1s ease-in-out infinite}
.bo-bounce{animation:boBounce .5s ease-in-out infinite}
.bo-tremble{animation:tremble .09s linear infinite}
.bo-still{}
.bo-jump{animation:boJump .6s cubic-bezier(.3,1.5,.5,1) 3}
.bo-spin{animation:boSpin .9s cubic-bezier(.4,1.4,.5,1) 1}
.bo-peek{animation:boPeek 3s ease-in-out infinite}
.hair{transform-origin:140px 100px}
.mag{animation:magnify 2.6s ease-in-out infinite alternate}
.hover-stamp{animation:hoverStamp .45s ease-in-out infinite alternate}
.slam{animation:slam .45s cubic-bezier(.2,1.5,.5,1) both}
.shake{animation:shake .45s linear .05s 1}
.dim{animation:fadeIn .5s ease both}
.floatup{animation:floatUp 1.8s ease-out .5s both}
.dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
.wobble{animation:wobble 3s ease-in-out infinite;display:inline-block;transform-origin:50% 80%}
.tilt-note{transform:rotate(-1.5deg)}
.np-yellow{background:#fff4c2}.np-pink{background:#ffe0ec}.np-mint{background:#d3f4f1}
.np-lined{background:#ffffff repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 25px,#b9d9ca 25px 26px);background-position:0 30px}
.np-grid{background:#ffffff linear-gradient(90deg,rgba(11,116,119,.12) 1px,rgba(0,0,0,0) 1px) 0 0/14px 14px,linear-gradient(180deg,rgba(11,116,119,.12) 1px,rgba(0,0,0,0) 1px) 0 0/14px 14px}
.nf-hand{font-family:"Patrick Hand",cursive;font-size:20px;line-height:26px}
.nf-caveat{font-family:Caveat,cursive;font-weight:600;font-size:24px;line-height:26px}
.nf-gochi{font-family:"Gochi Hand",cursive;font-size:20px;line-height:26px}
.nf-indie{font-family:"Indie Flower",cursive;font-size:19px;line-height:26px;font-weight:700}
.nf-marker{font-family:"Permanent Marker",cursive;font-size:16px;line-height:26px}
.nf-type{font-family:"Special Elite","Courier New",monospace;font-size:16px;line-height:26px}
.nf-mono{font-family:"Courier Prime","Courier New",monospace;font-weight:700;font-size:16px;line-height:26px}
.nf-print{font-family:Nunito,system-ui,sans-serif;font-weight:800;font-size:16px;line-height:26px}
.swim{animation:swim 4s ease-in-out infinite}
.pendulum{transform-box:view-box;transform-origin:50px 74px;animation:sway 1.6s ease-in-out infinite}
.neon{animation:neon 3s steps(1,end) infinite}
.tag{display:inline-block;padding:2px 8px;border:2px solid #1d2b3a;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.04em;background:#ffffff}
.tag.haeng{background:#ffe0ec}.tag.staa{background:#d3f4f1}.tag.gave{background:#ffd84d}
.award{padding:10px 14px;border:3px solid #1d2b3a;border-radius:16px;background:#ffd84d;box-shadow:4px 4px 0 #1d2b3a;font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:17px}
@keyframes swim{0%,100%{transform:translateX(-14px)}50%{transform:translateX(12px)}}
@keyframes neon{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.35}95%{opacity:1}97%{opacity:.5}}
.slideIn{animation:slideIn .6s cubic-bezier(.3,1.3,.5,1) both}
.star{color:#c8d8d0}
.star.on{color:#ffd84d;animation:starPop .5s cubic-bezier(.3,1.8,.5,1) both}
.star.on:nth-child(2){animation-delay:.15s}.star.on:nth-child(3){animation-delay:.3s}
.seg{flex-grow:1;height:10px;border-radius:999px;border:2px solid #1d2b3a;background:#ffffff;transition:background .3s}
.seg.on{background:#c2185b}
.mark-ok{color:#0b7477}.mark-bad{color:#c2185b}
.row-bad{background:#ffe0ec}
.stamp{font-family:Fredoka,ui-rounded,system-ui,sans-serif;font-weight:700;font-size:58px;line-height:1;letter-spacing:.08em;padding:10px 20px;border:7px solid currentColor;border-radius:14px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 3px rgba(255,255,255,.9)}
.stamp-ok{color:#0b7477}.stamp-no{color:#c2185b}
.verdict{background:#ffffff}.verdict.ok{background:#d3f4f1}.verdict.no{background:#ffe0ec}
.bubble.sm{font-size:16px;line-height:21px;padding:10px 14px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:12px;height:18px;border:2px solid #1d2b3a;border-radius:4px;animation:fall 2.6s cubic-bezier(.3,.6,.6,1) both}
.confetti i:nth-child(3n){border-radius:999px;width:14px;height:14px}
.confetti i:nth-child(1){left:4%;background:#ffd84d;animation-delay:.05s}
.confetti i:nth-child(2){left:10%;background:#ef5b93;animation-delay:.3s}
.confetti i:nth-child(3){left:16%;background:#34b8b5;animation-delay:.1s}
.confetti i:nth-child(4){left:22%;background:#ffd84d;animation-delay:.45s}
.confetti i:nth-child(5){left:28%;background:#ef5b93;animation-delay:.2s}
.confetti i:nth-child(6){left:34%;background:#a9e8e3;animation-delay:.6s}
.confetti i:nth-child(7){left:40%;background:#ffd84d;animation-delay:.15s}
.confetti i:nth-child(8){left:46%;background:#34b8b5;animation-delay:.5s}
.confetti i:nth-child(9){left:52%;background:#ef5b93;animation-delay:.25s}
.confetti i:nth-child(10){left:58%;background:#ffd84d;animation-delay:.7s}
.confetti i:nth-child(11){left:64%;background:#a9e8e3;animation-delay:.1s}
.confetti i:nth-child(12){left:70%;background:#ef5b93;animation-delay:.4s}
.confetti i:nth-child(13){left:76%;background:#34b8b5;animation-delay:.2s}
.confetti i:nth-child(14){left:82%;background:#ffd84d;animation-delay:.55s}
.confetti i:nth-child(15){left:88%;background:#ef5b93;animation-delay:.05s}
.confetti i:nth-child(16){left:94%;background:#34b8b5;animation-delay:.35s}
.confetti i:nth-child(17){left:13%;background:#ffc2d8;animation-delay:.9s}
.confetti i:nth-child(18){left:37%;background:#ffd84d;animation-delay:1s}
.confetti i:nth-child(19){left:61%;background:#34b8b5;animation-delay:.85s}
.confetti i:nth-child(20){left:85%;background:#ef5b93;animation-delay:1.1s}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-4deg)}70%{opacity:1;transform:scale(1.07) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes popB{0%{opacity:0;transform:scale(.3) rotate(4deg)}70%{opacity:1;transform:scale(1.07) rotate(-1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes chipPop{0%{transform:scale(.85)}60%{transform:scale(1.12) rotate(-3deg)}100%{transform:rotate(-1.5deg) scale(1.04)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes walkA{0%{transform:translateX(-360px)}55%{transform:translateX(14px) translateY(0)}68%{transform:translateX(0) translateY(-22px)}82%{transform:translateY(0) scaleY(.92)}100%{transform:none}}
@keyframes walkB{0%{transform:translateX(-360px)}55%{transform:translateX(14px) translateY(0)}68%{transform:translateX(0) translateY(-22px)}82%{transform:translateY(0) scaleY(.92)}100%{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes kajIn{0%{transform:translateY(120%) rotate(-10deg)}70%{transform:translateY(-6%) rotate(4deg)}100%{transform:none}}
@keyframes boIn{0%{transform:translateY(80px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes boTilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg) translateY(-4px)}}
@keyframes boBounce{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-12px) scaleY(1.03)}}
@keyframes tremble{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-1px,2px)}100%{transform:translate(0,0)}}
@keyframes boJump{0%,100%{transform:translateY(0)}40%{transform:translateY(-46px) rotate(-6deg)}70%{transform:translateY(0) scaleY(.9)}}
@keyframes boSpin{0%{transform:rotate(0)}80%{transform:rotate(380deg)}100%{transform:rotate(360deg)}}
@keyframes boPeek{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes magnify{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(330px,40px) rotate(6deg)}50%{transform:translate(60px,130px) rotate(-4deg)}75%{transform:translate(360px,200px) rotate(8deg)}100%{transform:translate(120px,270px) rotate(-6deg)}}
@keyframes hoverStamp{0%{transform:translateY(-14px) rotate(-6deg)}100%{transform:translateY(4px) rotate(5deg)}}
@keyframes slam{0%{opacity:0;transform:scale(3.2) rotate(-30deg)}55%{opacity:1;transform:scale(.88) rotate(-11deg)}75%{transform:scale(1.06) rotate(-13deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-10px,6px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,4px)}80%{transform:translate(4px,-2px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floatUp{0%{opacity:0;transform:translateY(20px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1;transform:translateY(-30px) scale(1)}100%{opacity:0;transform:translateY(-60px)}}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@keyframes wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes slideIn{0%{opacity:0;transform:translateX(120px) rotate(8deg)}100%{opacity:1;transform:none}}
@keyframes starPop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}
@keyframes nudge{0%,80%,100%{transform:none}85%{transform:rotate(-2deg) scale(1.03)}90%{transform:rotate(2deg) scale(1.03)}95%{transform:rotate(-1deg)}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(900px) rotate(720deg)}}
.lava1,.lava2,.lava3,.snow,.tw1,.tw2,.tw3,.zzz{transform-box:fill-box;transform-origin:center}
.lava1{animation:lava 5s ease-in-out infinite}.lava2{animation:lava 6s ease-in-out 1s infinite reverse}.lava3{animation:lava 4s ease-in-out 2s infinite}
.tw1{animation:tw 1.2s steps(2,end) infinite}.tw2{animation:tw 1.2s steps(2,end) .4s infinite}.tw3{animation:tw 1.2s steps(2,end) .8s infinite}
.sway{transform-box:view-box;transform-origin:50px 0;animation:sway 3s ease-in-out infinite}
.tail{transform-box:view-box;transform-origin:80px 82px;animation:tail 2s ease-in-out infinite}
.zzz{animation:zzz 2.4s ease-in-out infinite}
.yoyo-str{transform-box:view-box;transform-origin:50px 9px;animation:yoyoStr 2.6s ease-in-out infinite}.yoyo-disk{animation:yoyoDisk 2.6s ease-in-out infinite}@keyframes yoyoStr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.2)}}@keyframes yoyoDisk{0%,100%{transform:translateY(0)}50%{transform:translateY(30px)}}

.slot{padding:0;margin:0;border:3px solid transparent;background:transparent;border-radius:16px;cursor:default;display:flex;align-items:center;justify-content:center;color:#1d2b3a;box-sizing:border-box}
.slot > div{align-self:flex-start}
.slot.clickable{cursor:pointer}
.slot.edit{cursor:pointer;border:3px dashed rgba(29,43,58,.45);background:rgba(255,255,255,.28)}
.slot.edit:hover{background:rgba(255,255,255,.6)}
.slot.target{border-color:#c2185b;background:rgba(255,255,255,.7);color:#c2185b;animation:slotPulse .9s ease-in-out infinite}
.slot.picked{border:3px solid #c2185b;background:rgba(255,216,77,.55);animation:wiggle .6s ease-in-out infinite}
.slot:focus-visible{outline:3px solid #c2185b;outline-offset:3px}
button.slot,.inv-grid button{touch-action:none;-webkit-user-select:none;user-select:none}
button.slot.dragok{border-color:#0b7477;background:rgba(199,236,233,.92);color:#0b7477;animation:none}
button.slot.dragbad{border-color:#c2185b;background:rgba(255,214,224,.85);animation:none}
.dragging-src .pynt{opacity:.25}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 10px rgba(29,43,58,.35))}
.inv{font:inherit;color:#1d2b3a;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:3px solid #1d2b3a;border-radius:16px;background:#ffffff;box-shadow:4px 4px 0 #1d2b3a;cursor:pointer;text-align:center;min-width:0;box-sizing:border-box;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
.inv:hover{transform:translate(-1px,-3px) rotate(-1deg)}
.inv.stored{background:#eefaf4;border-style:dashed}
.inv.on{background:#fff4c2;border-color:#c2185b;box-shadow:4px 4px 0 #c2185b;transform:rotate(-2deg) scale(1.04)}
.inv:focus-visible{outline:3px solid #c2185b;outline-offset:3px}
@keyframes slotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.globeA{animation:globeA .7s ease-in-out}.globeB{animation:globeB .7s ease-in-out}
.snowing .snow{animation:snowfall 1.8s ease-in-out}
.shop-card{position:relative;box-sizing:border-box;min-width:0;padding:14px;border:3px solid #1d2b3a;border-radius:22px;background:#ffffff;box-shadow:5px 5px 0 #1d2b3a;display:flex;flex-direction:column;gap:6px;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.shop-card:hover{transform:translateY(-4px) rotate(-.6deg)}
.shop-card.owned{background:#d3f4f1}
.justbought{animation:chipPop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes lava{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-26px) scale(1.2,.85)}}
@keyframes tw{0%{opacity:1}50%{opacity:.3}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes tail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes zzz{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-8px);opacity:1}}
@keyframes globeA{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) translateY(-6px)}40%{transform:rotate(12deg)}60%{transform:rotate(-10deg) translateY(-4px)}80%{transform:rotate(6deg)}}
@keyframes globeB{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) translateY(-6px)}40%{transform:rotate(12deg)}60%{transform:rotate(-10deg) translateY(-4px)}80%{transform:rotate(6deg)}}
@keyframes snowfall{0%{transform:translateY(-14px);opacity:.2}30%{transform:translateY(-18px) translateX(4px);opacity:1}100%{transform:translateY(0);opacity:1}}

/* ============================================================
   LAYOUT — responsivt: mobil (375), tablet (768), laptop (1024), bred (1440)
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:#eefaf4 radial-gradient(#cdebdc 1.6px,transparent 1.8px) 0 0/22px 22px;min-height:100vh;overflow-x:hidden}
.app{min-height:100vh;display:flex;flex-direction:column}
.small{font-size:14px;line-height:19px;color:#4d5f6e}
.strong{font-weight:700}
.muted-text{font-size:15px;line-height:21px;font-weight:700;color:#4d5f6e}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack-tight{display:flex;flex-direction:column;gap:6px}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn-small{min-height:44px;font-size:16px;padding:0 14px}
.card{border:3px solid #1d2b3a;border-radius:28px;background:#fff;box-shadow:8px 8px 0 #1d2b3a}
.h-big{margin:0;font-size:clamp(32px,6vw,46px);line-height:1.05;font-weight:700}
.h-mid{margin:0;font-size:clamp(26px,4vw,34px);line-height:1.1;font-weight:700}
.h3{font-size:18px;font-weight:600}
.num.static{animation:none}

/* Topbar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:#fff;border-bottom:3px solid #1d2b3a;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px}
.brand-name{font-size:24px;font-weight:700;color:#c2185b;letter-spacing:-.01em}
.daybox{display:flex;flex-direction:column;gap:1px;min-width:0}
.daybox b{font-size:17px;font-weight:600}
.daybox span{font-size:13px;font-weight:700;color:#4d5f6e}
.controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.count{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 8px;border:3px solid #1d2b3a;border-radius:999px;box-shadow:3px 3px 0 #1d2b3a;font-size:18px;font-weight:600;white-space:nowrap}
.count-star{background:#fff4c2}.count-money{background:#d3f4f1}
@media (max-width:640px){
  .brand-name{font-size:20px}
  .daybox{order:3;width:100%}
  .controls{order:2}
  .count{height:40px;font-size:16px;padding:0 10px 0 6px}
  .count svg{width:22px;height:22px}
  .icon-btn{width:42px;height:42px}
}
@media (max-width:400px){ .brand-name{display:none} .controls{margin-left:0;justify-content:flex-start;width:100%} }

.screen{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:16px 16px 28px;position:relative}
@media (min-width:900px){ .screen{padding:22px 24px 32px} }
.center-screen{display:flex;align-items:flex-start;justify-content:center}
@media (min-height:760px) and (min-width:900px){ .center-screen{align-items:center} }

/* Tegnede scener, der skaleres til bredden */
.stage{position:relative;width:100%;overflow:hidden}
.stage-in{position:absolute;left:0;top:0;transform-origin:0 0}
.card-stage{border:3px solid #1d2b3a;border-radius:24px;box-shadow:8px 8px 0 #1d2b3a;background:#fff}

/* Forside */
.title-grid{display:grid;gap:28px;align-items:center}
@media (min-width:1000px){ .title-grid{grid-template-columns:minmax(0,1fr) minmax(0,540px)} }
.title-text{display:flex;flex-direction:column;gap:20px;min-width:0}
.kicker{align-self:flex-start;padding:8px 16px;border:3px solid #1d2b3a;border-radius:999px;background:#ffd84d;box-shadow:3px 3px 0 #1d2b3a;font-size:17px;font-weight:600;transform:rotate(-2deg)}
.title-h1{margin:0;font-size:clamp(54px,11vw,92px);line-height:.92;font-weight:700;letter-spacing:-.02em}
.title-h1 .wobble{color:#c2185b}
.lead{margin:0;font-size:clamp(17px,2.4vw,20px);line-height:1.5;font-weight:700;max-width:560px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.howto-card{padding:14px;border:3px solid #1d2b3a;border-radius:18px;background:#fff;box-shadow:4px 4px 0 #1d2b3a;display:flex;flex-direction:column;gap:6px}
.title-stage{max-width:560px;margin:0 auto}

/* Dagens intro + dagens resultat */
.intro-card{width:100%;max-width:880px;padding:clamp(20px,4vw,36px);display:grid;gap:24px;align-items:center}
@media (min-width:760px){ .intro-card{grid-template-columns:240px 1fr} }
.bo-box{width:100%;max-width:240px;margin:0 auto}
@media (max-width:759px){ .intro-card .bo-box{max-width:170px} }
.value-box{display:flex;gap:12px;align-items:center;padding:10px 14px;border:3px dashed #1d2b3a;border-radius:14px;background:#eefaf4;font-size:15px;line-height:20px;font-weight:700}
.value-letter{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:#1d2b3a;color:#ffd84d;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center}
.done-card{width:100%;max-width:1040px;padding:clamp(20px,4vw,34px);display:grid;gap:26px;align-items:center}
@media (min-width:860px){ .done-card{grid-template-columns:280px 1fr} }
.done-bo{display:flex;flex-direction:column;align-items:center;gap:12px}
@media (max-width:859px){ .done-bo .bo-box{max-width:170px} }
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{padding:12px 14px;border:3px solid #1d2b3a;border-radius:18px}
.stat-num{font-size:28px;font-weight:700}
.result-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;border:2px solid #b9d9ca;border-radius:12px;background:#fff}

/* Kontoret: rum + kontrakt */
.office{display:grid;gap:22px;max-width:680px;margin:0 auto;align-items:start}
@media (min-width:900px){ .office{grid-template-columns:minmax(0,1fr) minmax(0,520px);max-width:none} .sidecol{position:sticky;top:12px} }
@media (min-width:1260px){ .office{grid-template-columns:minmax(0,1fr) 640px} }
.roomwrap{position:relative;min-width:0}
.talk{display:flex;flex-direction:column;gap:12px;margin-top:18px;padding-left:14px}
.note{position:relative;margin:26px auto 4px;max-width:340px;padding:14px 18px 12px;border:3px solid #1d2b3a;border-radius:8px;box-shadow:6px 6px 0 #1d2b3a;transform:rotate(-2.5deg)}
.note .tape{position:absolute;left:50%;top:-13px;width:90px;height:24px;margin-left:-45px;background:#a9e8e3;border:2px solid #1d2b3a;transform:rotate(3deg);opacity:.9}
@media (min-width:1260px){
  .talk{position:absolute;left:55.2%;right:2.5%;top:2%;margin:0;padding:0;z-index:3}
  .talk .bubble.sm{font-size:15px;line-height:20px}
  .roomwrap .note{position:absolute;left:3.4%;top:74.3%;width:45.5%;max-width:none;margin:0;z-index:3;transform:rotate(-3deg)}
}
.name-pill{position:absolute;left:24px;top:478px;padding:4px 12px;border:3px solid #1d2b3a;border-radius:999px;background:#fff;font-size:15px;font-weight:800}
.deco-sticky{position:absolute;left:22px;top:596px;width:270px;padding:14px 18px;border:3px solid #1d2b3a;border-radius:8px;box-shadow:6px 6px 0 #1d2b3a;transform:rotate(-3deg)}
.slot .pynt{position:absolute;left:0;top:0}

.contract{position:relative;padding:26px clamp(14px,3vw,24px) 18px;border-radius:22px;display:flex;flex-direction:column;gap:12px}
.clip{position:absolute;left:50%;top:-14px;width:150px;height:28px;margin-left:-75px;border:3px solid #1d2b3a;border-radius:10px;background:#c2185b;box-shadow:3px 3px 0 #1d2b3a}
.contract-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:3px dashed #b9d9ca;flex-wrap:wrap}
.contract-title{font-size:26px;line-height:28px;font-weight:700;letter-spacing:.04em}
.retry-note{font-size:14px;line-height:19px;padding:8px 12px;max-width:100%}
.stamp-spot{width:64px;height:64px;border:3px dashed #b9d9ca;border-radius:999px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:13px;font-weight:800;color:#4d5f6e}
.field{display:flex;flex-direction:column;gap:7px}
.field-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:13px;font-weight:700;color:#4d5f6e;margin-left:auto}
.chips{display:grid;gap:8px}
.g-svc{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.g-dur{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.g-small{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
@media (max-width:420px){ .g-svc{grid-template-columns:1fr 1fr} .g-svc .chip{font-size:14px;gap:5px;padding:6px} .g-dur{grid-template-columns:1fr 1fr} }
.contract-foot{margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sign{display:flex;flex-direction:column;gap:2px}
.sign-line{width:180px;border-top:2px solid #1d2b3a}
.contract-foot .btn{flex-grow:1;max-width:340px;margin-left:auto}

.kaj-toast{position:fixed;left:12px;right:12px;bottom:12px;max-width:470px;display:flex;align-items:flex-end;gap:6px;z-index:40;pointer-events:none}
.kaj-fig{flex-shrink:0;width:110px}
.kaj-bubble{pointer-events:auto;font-size:16px;line-height:21px;padding:10px 14px;margin-bottom:40px}
@media (max-width:420px){ .kaj-fig{width:80px} .kaj-fig svg{width:80px;height:96px} }

.deco-panel{padding:22px clamp(14px,3vw,24px);border-radius:22px;display:flex;flex-direction:column;gap:14px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.inv-name{font-size:13px;line-height:16px;font-weight:600;min-width:0;overflow-wrap:break-word}
.inv-where{font-size:11px;line-height:14px;font-weight:800;color:#4d5f6e}
.empty{padding:20px;border:3px dashed #b9d9ca;border-radius:18px;font-size:17px;font-weight:700;color:#4d5f6e}

/* Chef Bos gennemsyn */
.review{display:grid;gap:22px;max-width:680px;margin:0 auto;align-items:start}
@media (min-width:900px){ .review{grid-template-columns:minmax(0,480px) minmax(0,1fr);max-width:1240px} }
.review-right{display:flex;flex-direction:column;gap:20px;min-width:0}
.paper{position:relative;padding:20px clamp(14px,3vw,28px);border:3px solid #1d2b3a;border-radius:12px;background:#fff;box-shadow:8px 8px 0 #1d2b3a;overflow:hidden}
.paper-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:3px dashed #b9d9ca;margin-bottom:8px}
.paper-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 10px;border-bottom:2px solid #d3f4f1;border-radius:8px}
.paper-lbl{width:110px;flex-shrink:0}
.paper-val{flex-grow:1;font-size:clamp(18px,2.6vw,22px);font-weight:500;min-width:0;overflow-wrap:anywhere}
.mag2{position:absolute;pointer-events:none;animation:magP 2.6s ease-in-out infinite alternate}
.hover-pos{position:absolute;left:50%;top:24%;margin-left:-65px;pointer-events:none}
.stamp-pos{position:absolute;right:6%;top:34%;pointer-events:none}
.stamp{font-size:clamp(34px,6vw,58px)}
.verdict{position:relative;padding:20px 22px;border:3px solid #1d2b3a;border-radius:28px;box-shadow:8px 8px 0 #1d2b3a;display:flex;flex-direction:column;gap:12px;min-height:220px}
.verdict-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.remark{font-size:clamp(17px,2.4vw,20px);line-height:1.35;font-weight:500}
.coin-pop{position:absolute;right:24px;bottom:24px;padding:8px 16px;border:3px solid #1d2b3a;border-radius:999px;background:#ffd84d;box-shadow:3px 3px 0 #1d2b3a;font-size:24px;font-weight:700;pointer-events:none}
.spotlight{position:fixed;inset:0;pointer-events:none;z-index:30;background:radial-gradient(circle at 60% 45%,rgba(29,43,58,0) 0,rgba(29,43,58,0) 28vmin,rgba(29,43,58,.55) 60vmin)}
.confetti{position:fixed;inset:0;z-index:60}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
@keyframes magP{0%{left:2%;top:4%;transform:rotate(-8deg)}25%{left:62%;top:12%;transform:rotate(6deg)}50%{left:10%;top:36%;transform:rotate(-4deg)}75%{left:64%;top:56%;transform:rotate(8deg)}100%{left:22%;top:68%;transform:rotate(-6deg)}}

/* Butik */
.shop-head{display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;margin-bottom:20px}
.shop-title{flex:1 1 320px;display:flex;flex-direction:column;gap:6px}
.shop-quote{flex:1 1 260px;max-width:360px;font-size:16px;line-height:21px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding:4px 8px 8px 0}
.shop-preview{position:relative;height:104px;border:3px solid #1d2b3a;border-radius:14px;background:#eefaf4;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.shop-preview .tag{position:absolute;left:6px;top:6px}
.shop-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.shop-name{font-size:17px;line-height:21px;font-weight:600;min-width:0;overflow-wrap:break-word}
.shop-price{font-size:16px;font-weight:700;color:#0b7477;white-space:nowrap}
.shop-desc{font-size:13px;line-height:17px;font-weight:700;color:#4d5f6e;flex-grow:1}

/* Ur, kalender, underskrift, pynt-klik, begivenheder */
.count-clock{background:#fff;gap:8px}
.count-clock .clockbar{width:52px;height:10px;border:2px solid #1d2b3a;border-radius:999px;overflow:hidden;background:#eefaf4;display:block}
.count-clock .clockbar i{display:block;height:100%;background:#0b7477}
.count-clock.late{background:#ffe0ec;animation:latePulse 1s ease-in-out infinite}
.count-clock.late .clockbar i{background:#c2185b}
@keyframes latePulse{0%,100%{transform:none}50%{transform:scale(1.06)}}
@media (max-width:640px){ .count-clock .clockbar{display:none} }
.wall-cal{position:absolute;left:20px;top:14px;width:74px;border:3px solid #1d2b3a;border-radius:8px;background:#fff;box-shadow:3px 3px 0 #1d2b3a;text-align:center;overflow:hidden;transform:rotate(-3deg)}
.wall-cal-top{background:#c2185b;color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;padding:3px 0}
.wall-cal-num{font-size:34px;line-height:36px;font-weight:700}
.wall-cal-wd{font-size:11px;font-weight:800;padding-bottom:4px;color:#1d2b3a}
.wall-clock{position:absolute;left:280px;top:10px;filter:drop-shadow(3px 3px 0 #1d2b3a)}
.wall-clock.late{animation:wiggle .5s ease-in-out infinite}
.sign{min-width:220px;flex:1 1 240px;max-width:320px}
.sign-box{min-height:56px;display:flex;align-items:flex-end}
.sign-empty{font-size:13px;font-weight:700;color:#6f7f8c;padding-bottom:6px}
.sign-line{width:100%}
.sig-draw{animation:sigDraw 1.4s steps(16,end) both}
@keyframes sigDraw{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -5% -20% 0)}}
.paper-sig{display:flex;align-items:center;gap:12px;padding:6px 10px 0;flex-wrap:wrap}
.paper-sig svg{max-width:240px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:#c2185b;text-decoration:underline;cursor:pointer}
.slot.any.edit{border-color:rgba(194,24,91,.45)}
.pokeA{animation:pokeA .6s cubic-bezier(.3,1.6,.5,1)}.pokeB{animation:pokeB .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pokeA{0%,100%{transform:none}30%{transform:translateY(-14px) rotate(-8deg) scale(1.08)}60%{transform:translateY(0) rotate(6deg)}}
@keyframes pokeB{0%,100%{transform:none}30%{transform:translateY(-14px) rotate(8deg) scale(1.08)}60%{transform:translateY(0) rotate(-6deg)}}
.poke-pop{position:absolute;z-index:6;transform:translateX(-50%);white-space:nowrap;padding:4px 12px;border:3px solid #1d2b3a;border-radius:14px;background:#fff;box-shadow:3px 3px 0 #1d2b3a;font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:18px;pointer-events:none;animation:pokePop 1.4s ease-out both}
@keyframes pokePop{0%{opacity:0;margin-top:14px}15%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-18px}}
.disco-lights{position:absolute;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle at 20% 30%,rgba(239,91,147,.5) 0 70px,rgba(0,0,0,0) 72px),radial-gradient(circle at 75% 25%,rgba(255,216,77,.55) 0 60px,rgba(0,0,0,0) 62px),radial-gradient(circle at 50% 70%,rgba(52,184,181,.5) 0 80px,rgba(0,0,0,0) 82px),rgba(29,43,58,.28);animation:disco .5s steps(2,end) infinite}
@keyframes disco{50%{background-position:140px 60px,-120px 80px,80px -100px,0 0}}
.timeup-note{padding:10px 14px;border:3px solid #1d2b3a;border-radius:14px;background:#ffe0ec;font-weight:800;font-size:15px}
.bonus-note{padding:10px 14px;border:3px solid #1d2b3a;border-radius:14px;background:#d3f4f1;font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:17px}
.record-note{padding:10px 14px;border:3px solid #1d2b3a;border-radius:14px;background:#fff4c2;font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:17px;box-shadow:4px 4px 0 #1d2b3a}
.new-items{padding:12px 14px;border:3px solid #1d2b3a;border-radius:16px;background:#fff4c2;box-shadow:4px 4px 0 #1d2b3a;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.new-title{font-size:20px;font-weight:700}
.new-row{display:flex;flex-wrap:wrap;gap:10px}
.new-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;max-width:90px;text-align:center}
.shop-card.locked{background:#eef1f0;border-style:dashed;box-shadow:4px 4px 0 #9fb8ac}
.shop-card.locked .shop-preview{filter:grayscale(1);opacity:.45}
.shop-card.locked .shop-name,.shop-card.locked .shop-price{color:#6f7f8c}
.tag.locked{background:#e3eee8}
.event-art{display:flex;flex-direction:column;align-items:center;gap:6px}
.event-art .bo-box{max-width:220px}
.food{margin-top:-40px}
.meeting-card{width:100%;max-width:880px;padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:20px}
.whiteboard{border:4px solid #1d2b3a;border-radius:16px;background:#fff;padding:18px 22px;min-height:190px;box-shadow:inset 0 0 0 6px #eefaf4}
.board-title{font-size:clamp(24px,4vw,34px);font-weight:700;color:#0b7477;line-height:1.1}
.board-sub{font-family:'Caveat',cursive;font-size:24px;color:#c2185b;margin-top:6px}
.meeting-bottom{display:grid;gap:18px;align-items:end}

.small-bo{max-width:170px}

@media (prefers-reduced-motion:reduce){

}

function makeSigPath() {
  const P = SIG_PARTS, parts = [];
  const pool = ['loops', 'spiral', 'swoosh', 'zigzag', 'capital', 'underloop'].sort(() => Math.random() - 0.5);
  const n = 2 + Math.floor(Math.random() * 2);
  pool.slice(0, n).forEach(k => {
    if (k === 'loops') parts.push(P.loops(rnd(10, 120), rnd(190, 290), rnd(52, 66)));
    else if (k === 'spiral') parts.push(P.spiral(rnd(230, 280), rnd(22, 40)));

function nextOf(list, v, step) { const i = list.indexOf(v); return list[(i + (step || 1) + list.length * 4) % list.length]; }
function norm(s) { return String(s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
function fmtKr(n) { return Number(n).toLocaleString('da-DK') + ' kr'; }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
function cap(s) { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }
function fill(t, v) { return t.replace(/\{v\}/g, v).replace(/\{V\}/g, cap(v)); }
function valText(field, v) { if (v === null || v === undefined || v === '') return '—'; if (field === 'price') return v + ' kr'; if (field === 'service') return String(v).toLowerCase(); return String(v); }
function otherThan(list, v) { return pick(list.filter(x => x !== v)); }

function misspell(name) {
  const rules = [
    s => s.replace(/([a-zæøå])\1/i, '$1'),
    s => s.replace(/\bK(?=[aeiouå])/, 'C'),
    s => s.replace(/\bC/, 'K'),
    s => s.replace(/aa/, 'å'),
    s => s.replace(/ø/, 'ö'),
    s => s.replace(/i(?=[a-zæøå])/, 'y'),
    s => s.replace(/y/, 'i'),
    s => s.replace(/e(?=n\b|r\b)/, 'æ'),
    s => s.replace(/sen\b/, 'son'),
    s => s.replace(/([aeiouyæøå])([lnrst])(?=[aeiouyæøå])/, '$1$2$2'),
    s => s.replace(/h\b/, ''),
    s => s.replace(/d\b/, 'dt'),
    s => s.replace(/ph/i, 'f'),
    s => s.replace(/v/, 'w')
  ];
  const order = rules.slice().sort(() => Math.random() - 0.5);
  for (const r of order) { const t = r(name); if (t !== name && t.length > 2) return t; }
  return name.replace(/(.)$/, '$1$1');
}
function spellDiff(navn, typo) {
  const a = navn.split(' '), b = typo.split(' ');
  let w = a[a.length - 1];
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) { w = a[i]; break; }
  return w.toUpperCase().split('').join('-');
}

function twistsFor(day, i) {
  if (day === 1) return [];
  if (day === 2) return i === 0 ? [] : ['typo'];
  if (day === 3) return i === 0 ? ['typo'] : ['change'];
  if (day === 4) return i === 0 ? ['change'] : ['kaj'];
  if (day === 5) return [['typo'], ['change'], ['kaj'], ['typo', 'kaj']][i] || ['change'];
  if (day === 6) return i < 2 ? ['math'] : ['math', pick(['typo', 'kaj'])];
  const all = ['typo', 'change', 'kaj', 'math'];
  const first = pick(all);
  const out = [first];
  if (Math.random() < 0.55) out.push(pick(all.filter(t => t !== first)));
  if (day >= 9 && Math.random() < 0.3) all.forEach(t => { if (!out.includes(t)) out.push(t); });
  return out;
}

function buildDay(day, recent) {
  const n = day <= 4 ? 3 : day === 5 ? 4 : Math.min(6, 4 + Math.floor((day - 5) / 2));
  const used = new Set(recent || []);
  const list = [];
  const svcIds = SERVICES.map(s => s.id);
  let lastService = null;
  for (let i = 0; i < n; i++) {
    let navn = '', guard = 0;
    do { navn = pick(FIRST) + ' ' + pick(LAST); guard++; } while ((used.has(navn) || used.has(navn.split(' ')[0])) && guard < 60);
    used.add(navn); used.add(navn.split(' ')[0]);
    const service = otherThan(svcIds, lastService);
    lastService = service;
    const base = {
      navn, shape: pick(SHAPES), body: pick(BODIES), acc: pick(ACCS),
      service, duration: pick(DURATIONS), date: pick(DATES), price: pick(PRICES),
      hello: pick(HELLO[service]), closer: pick(CLOSERS), noteFont: pick(NOTE_FONTS), notePaper: pick(NOTE_PAPERS), sig: makeSig(navn)
    };
    const tw = twistsFor(day, i);
    const t = { typo: tw.includes('typo'), change: tw.includes('change'), kaj: tw.includes('kaj'), math: tw.includes('math') };
    if (t.math) {
      base.duration = pick(['1 uge', '2 uger', '3 uger']);
      const w = WEEKS[base.duration];
      base.rate = pick([50, 100, 150].filter(r => r * w <= 300));
      base.price = base.rate * w;
      base.mathLine = MATH_LINES[Math.floor(Math.random() * MATH_LINES.length)].replace('{r}', base.rate + ' kr');
    }
    const correct = { name: navn, service: base.service, duration: base.duration, date: base.date, price: base.price };
    const c = Object.assign({}, base, { t, correct, noteName: navn });
    if (t.typo) {
      c.noteName = misspell(navn);
      c.typoLine = pick(TYPO_LINES).replace('{navn}', navn).replace('{spell}', spellDiff(navn, c.noteName));
    }
    if (t.change) {
      const f = pick(t.math ? ['duration', 'date', 'service'] : ['duration', 'date', 'price', 'service']);
      const lists = { duration: t.math ? ['1 uge', '2 uger', '3 uger'].filter(d => base.rate * WEEKS[d] <= 300) : DURATIONS, date: DATES, price: PRICES, service: svcIds };
      const v = otherThan(lists[f], base[f]);
      correct[f] = v;
      if (t.math && f === 'duration') correct.price = base.rate * WEEKS[v];
      c.changeField = f;
      c.changeLine = fill(pick(CHANGE_LINES[f]), valText(f, v));
    }
    if (t.kaj) {
      const f = pick(['price', 'date', 'duration'].filter(x => x !== c.changeField));
      const lists = { duration: DURATIONS, date: DATES, price: PRICES };
      const v = otherThan(lists[f], correct[f]);
      c.kajField = f; c.kajVal = v;
      c.kajLine = fill(pick(KAJ_LINES), valText(f, v));
    }
    list.push(c);
  }
  return list;
}

      return { kind: 'meeting', phase: 'start', points: pts, i: 0, reply: pick(REPLIES) };
    }
    return null;
  }
  giftAnswer(yes) {
    const ev = this.state.event;
    if (yes) { this.advanceClock(GIFT_COST); this.setState({ dayStars: this.state.dayStars + 1, event: Object.assign({}, ev, { phase: 'yes', line: pick(GIFT_YES) }) }); this.sfx('fanfare'); }
    else { this.setState({ event: Object.assign({}, ev, { phase: 'no', line: pick(GIFT_NO) }) }); this.sfx('boing'); }
  }
  meetingNext() {
    const ev = this.state.event;
    if (ev.phase === 'start') { this.advanceClock(MEETING_START); this.setState({ event: Object.assign({}, ev, { phase: 'point', i: 0, reply: pick(REPLIES) }) }); this.sfx('hmm'); return; }
    this.advanceClock(MEETING_POINT);
    if (ev.i + 1 < ev.points.length) { this.setState({ event: Object.assign({}, ev, { i: ev.i + 1, reply: pick(REPLIES) }) }); this.sfx('hmm'); }
    else { this.setState({ event: Object.assign({}, ev, { phase: 'end' }) }); this.sfx('ding'); }
  }
  eventDone() {
    this.sfx('blip');
    const s = this.state;
    if (s.clock >= DAY_MIN) return this.timeUp();
    this.setState({ event: null });
    this.startCustomer(s.idx + 1);
  }
  finishDay() {
    this.clearTimers();
    const s = this.state;
    const goal = s.customers.length * 2;
    const passed = s.dayStars >= goal;
    const early = !s.timeUp && s.clock < DAY_MIN ? Math.floor((DAY_MIN - s.clock) / 30) * 10 : 0;
    let best = s.best;
    const starRecord = passed && s.dayStars > ((s.best && s.best.stars) || 0);
    if (passed) {
      const b = best || { day: 0, money: 0, stars: 0 };
      best = { day: Math.max(b.day, s.day), money: Math.max(b.money, s.money), stars: Math.max(b.stars, s.dayStars) };
      saveBest(best);
    }
    const cleared = passed ? Math.max(s.cleared, s.day) : s.cleared;
    const newItems = cleared > s.cleared ? SHOP.filter(it => UNLOCK[it.id] === cleared + 1).map(it => ({ kind: it.id, name: it.name })) : [];
    const upd = {
      screen: 'done', best, cleared, newItems, bonus: early, starRecord, saveDay: passed ? s.day + 1 : s.day,
      money: s.money + early, earned: s.earned + early, dayMoney: s.dayMoney + early, award: false
    };
    const perfect = !s.timeUp && s.results.length > 0 && s.results.every(r => r.stars === 3);
    if (perfect && !s.owned.includes('medarbejder')) {
      Object.assign(upd, { owned: s.owned.concat(['medarbejder']), place: autoPlace(s.place, 'medarbejder'), award: true, doneQuote: 'En PERFEKT dag! Du er Månedens medarbejder. Jeg har selv hængt skiltet op. Lidt skævt.' });
    } else {
      upd.doneQuote = perfect ? 'Perfekt dag! Igen! Jeg er nødt til at lave et skilt til skiltet.' : (s.timeUp && !passed ? pick(TIMEUP_NO) : pick(passed ? DONE_YES : DONE_NO));
    }
    this.persist(upd);
    if (passed) this.sfx('fanfare'); else this.sfx('boing');
  }
  goHome() { this.clearTimers(); this.sfx('blip'); this.setState({ screen: 'title' }); }

  renderVals() {
    const s = this.state;
    const c = s.customers[s.idx] || { navn: '', t: {}, correct: { price: 0 }, service: '', duration: '', date: '', price: 0, shape: 'cirkel', body: '#ef5b93', acc: 'ingen', hello: '', closer: '' };

    const passed = s.dayStars >= goal;
    const best = s.best;
    const bestText = best ? 'Din rekord: dag ' + best.day + ' klaret · ' + fmtKr(s.earned) + ' tjent i alt' + (best.stars ? ' · ' + best.stars + ' ★ på en dag' : '') : 'Ingen rekord endnu — bliv den første!';
    const owns = (id) => s.owned.includes(id);
    const editing = s.screen === 'decorate';
    const sl = {};
    Object.keys(SLOT_TYPE).forEach(k => {

      sl[k] = {

        cls: 'slot' + (editing ? ' edit' : '') + (SLOT_TYPE[k] === 'alle' && editing ? ' any' : '') + (target ? ' target' : '') + (picked ? ' picked' : '') + (!editing && kind ? ' clickable' : '') + (globe ? ' ' + (s.globe % 2 ? 'globeA' : (s.globe ? 'globeB' : '')) : '') + (poked && !globe ? (s.poke.n % 2 ? ' pokeA' : ' pokeB') : '') + (kind === 'kugle' && s.snowing ? ' snowing' : ''),

        click: () => this.clickSlot(k)
      };
    });
    const level = (s.cleared || 0) + 1;
    const shopSorted = SHOP.slice().sort((a, b) => (a.gift ? -1 : 0) - (b.gift ? -1 : 0) || (UNLOCK[a.id] || 1) - (UNLOCK[b.id] || 1) || a.price - b.price);
    const shopItems = shopSorted.map(it => {
      const own = owns(it.id), short = it.gift ? 1 : it.price - s.money;

        tag: 'LÅST', tagCls: 'tag locked', cls: 'shop-card locked', btnCls: 'btn', btnText: 'Kommer på dag ' + lockDay, disabled: true, buy: () => { }
      };
      return {
        kind: it.id, name: it.name, desc: it.desc, priceText: it.gift ? 'Gave' : fmtKr(it.price),
        tag: it.gift ? 'GAVE' : (ITEM_TYPE[it.id] === 'haeng' ? 'HÆNGER' : 'STÅR'),
        tagCls: 'tag ' + (it.gift ? 'gave' : ITEM_TYPE[it.id]),
        cls: 'shop-card' + (own ? ' owned' : '') + (s.justBought === it.id ? ' justbought' : ''),
        btnCls: own ? 'btn btn-teal' : (short > 0 ? 'btn' : 'btn btn-go'),
        btnText: own ? (slotOf(s.place, it.id) ? 'Står på kontoret' : 'På lageret') : (it.gift ? 'Optjenes: perfekt dag' : (short > 0 ? 'Mangler ' + fmtKr(short) : 'Køb')),
        disabled: own || short > 0,
        buy: () => this.buy(it.id)
      };
    });

    return {
      inGame, muted: s.muted, soundOn: !s.muted, muteLabel: s.muted ? 'Slå lyd til' : 'Slå lyd fra',
      toggleMute: () => this.setState({ muted: !s.muted }),
      goHome: () => this.goHome(),
      dayLabel: 'Dag ' + s.day + ' · ' + dd.weekday + ' ' + dd.date + '. ' + dd.month,
      clockText: clockText(s.clock), clockPct: Math.round(Math.min(s.clock, DAY_MIN) / DAY_MIN * 100), late: s.clock >= DAY_MIN - 60,
      hourAng: Math.round(((8 * 60 + s.clock) % 720) / 720 * 360), minAng: (s.clock % 60) * 6,
      cal: dd, showNamePill: s.day === 1,
      signed: s.signed, signing: s.signing, sigKey: 'sig-' + s.signN,
      poke: !editing && s.poke ? s.poke : null, disco: s.disco && s.screen === 'office',
      canContinue: (s.saveDay || 1) > 1, continueLabel: 'Fortsæt: Dag ' + (s.saveDay || 1) + ' · ' + dayDate(s.saveDay || 1).weekday,
      continueGame: () => this.continueGame(), newGame: () => this.newGame(),

      bonusText: s.bonus ? 'Tidlig fyraften kl. ' + clockText(s.clock) + ': +' + fmtKr(s.bonus) + ' i bonus!' : '',
      timeUpText: s.timeUp ? 'Klokken blev 16:00 — fyraften! Kunder, der ikke nåede at blive betjent, gik hjem.' : '',
      newItems: s.newItems || [], showNew: !!(s.newItems && s.newItems.length),
      isEvent: s.screen === 'event', ev: s.event,
      giftYes: () => this.giftAnswer(true), giftNo: () => this.giftAnswer(false), meetingNext: () => this.meetingNext(), eventDone: () => this.eventDone(),
      custLabel: s.screen === 'done' || s.screen === 'intro' ? n + ' kunder i dag' : 'Kunde ' + (s.idx + 1) + ' af ' + n,
      starsLabel: s.dayStars + ' / ' + goal,
      moneyLabel: fmtKr(s.money),
      isShop: s.screen === 'shop',
      canShop: s.screen === 'title' || s.screen === 'intro' || s.screen === 'done' || s.screen === 'decorate',
      openShop: () => this.openShop(),
      closeShop: () => this.closeShop(),
      shopItems,
      shopQuote: s.justBought ? 'Uuuh, flot køb! Tryk på Indret kontoret for at bestemme, hvor den skal stå.' : SHOP_QUOTES[s.owned.length % SHOP_QUOTES.length],
      showBuyConfetti: !!s.justBought,
      sl,
      showRoom: s.screen === 'office' || s.screen === 'decorate',
      isDecorate: s.screen === 'decorate',
      openDecorate: () => this.openDecorate(),
      closeDecorate: () => this.closeDecorate(),
      storeSel: () => this.storeSel(),
      canStore: !!s.decoSel && !!slotOf(s.place, s.decoSel),
      decoMsg: s.decoMsg || (s.owned.length ? 'Træk tingene til nye pladser i rummet — eller tryk på en ting og vælg en plads.' : 'Her kan du stille dine ting, når du har købt noget.'),
      decoMsgCls: 'bubble boss sm ' + (s.decoMsg ? 'popB' : ''),
      ownedCount: s.owned.length,
      hasOwned: s.owned.length > 0, noOwned: s.owned.length === 0,
      inventory: SHOP.filter(it => owns(it.id)).map(it => {
        const at = slotOf(s.place, it.id), on = s.decoSel === it.id;
        return { kind: it.id, name: it.name, where: at ? SLOT_NAME[at] : 'På lageret', on: on ? 'true' : 'false', cls: 'inv' + (on ? ' on' : '') + (at ? '' : ' stored'), pick: () => this.pickItem(it.id) };
      }),
      shakeGlobe: () => this.shakeGlobe(),
      isTitle: s.screen === 'title', isIntro: s.screen === 'intro', isOffice: s.screen === 'office', isReview: s.screen === 'review', isDone: s.screen === 'done',
      startGame: () => this.startGame(),
      bestText,
      introKicker: 'Dag ' + s.day + ' · ' + dd.weekday + ' ' + dd.date + '. ' + dd.month + ' · ' + n + ' kunder',
      introTitle: dayInfo.title,
      introTip: dayInfo.tip,
      introValue: { letter: (s.introValue || VALUES[0])[0], text: (s.introValue || VALUES[0])[1] },
      showAward: !!s.award,
      noteCls: 'tilt-note ' + (c.notePaper || 'np-yellow'),
      noteFontCls: c.noteFont || 'nf-hand',
      introGoal: 'Dagens mål: ' + goal + ' stjerner. Rigtigt i første forsøg giver 3 stjerner — rettet giver 1. Mødetid 08:00, fyraften 16:00 — bliver du færdig før tid, får du bonus!',
      introMood: s.day >= 5 ? 'tosset' : 'glad',
      openDesk: () => this.openDesk(),

      cust: c,
      custMood: s.talking ? 'snak' : 'glad',
      walkCls: s.retryNote ? '' : (s.idx % 2 ? 'walkB' : 'walkA'),
      bubbles,
      note: { name: c.noteName, service: String(c.service).toLowerCase(), duration: c.duration, date: c.date, price: c.t && c.t.math ? c.rate + ' kr pr. uge' : c.price + ' kr' },
      showKaj: s.kaj && !s.kajGone,
      kajLine: c.kajLine || '',
      dismissKaj: () => { this.sfx('blip'); this.setState({ kajGone: true }); },
      form: f,
      onName: (e) => this.setState({ form: Object.assign({}, this.state.form, { name: e.target.value }), signed: false }),
      onSend: () => (this.state.signed ? this.send() : this.sign()),
      onNameKey: (e) => { if (e && e.key === 'Enter') { e.preventDefault(); if (this.state.signed) this.send(); else this.sign(); } },
      numCls,
      services: SERVICES.map(sv => ({ label: sv.id, d: sv.d, cls: f.service === sv.id ? 'chip on' : 'chip', on: f.service === sv.id ? 'true' : 'false', pick: () => this.setField('service', sv.id) })),
      durations: mkChips('duration', DURATIONS),
      dates: mkChips('date', DATES),
      prices: mkChips('price', PRICES, p => p + ' kr'),
      contractNo: 'Nr. ' + String(40 + s.day * 10 + s.idx).padStart(4, '0'),
      showRetry: !!s.retryNote, noRetry: !s.retryNote, retryNote: s.retryNote,
      sendDisabled: s.talking || missing > 0 || s.signing,
      sendCls: (s.talking || missing > 0 || s.signing) ? 'btn btn-go' : (s.signed ? 'btn btn-go ready' : 'btn btn-berry ready'),
      sendLabel: s.talking ? 'Kunden snakker stadig…' : missing > 0 ? 'Mangler ' + missing + (missing === 1 ? ' felt' : ' felter') : s.signing ? 'Kunden skriver under…' : !s.signed ? 'Få kundens underskrift' : (s.tries > 0 ? 'Send igen til Chef Bo' : 'Send til Chef Bo'),
      sendIcon: s.signed && !s.signing ? 'send' : 'pen',

      reviewCls: revealed ? 'shake' : '',
      boMood: revealed ? (v.ok ? 'jubel' : 'tosset') : boMoods[step],
      boCls: revealed ? (v.ok ? 'bo-jump' : 'bo-spin') : boClasses[step],
      bubbleText: revealed ? s.boLine : s.steps[step],
      bubbleCls: 'bubble boss tail-b ' + (step % 2 ? 'popB' : 'pop'),
      statusText: revealed ? (v.ok ? 'Stemplet: GODKENDT' : 'Stemplet: RETUR') : statusTexts[step],
      statusCls: revealed ? '' : 'dots',
      segs: [0, 1, 2, 3, 4].map(i => ({ cls: i <= step ? 'seg on' : 'seg' })),
      rows,
      showMag: step >= 1 && step <= 3,
      showHover: step === 4,
      showStamp: revealed,
      stampText: v.ok ? 'GODKENDT' : 'RETUR',
      stampCls: v.ok ? 'stamp stamp-ok' : 'stamp stamp-no',
      showDim: step === 4,
      showConfetti: revealed && v.ok,
      showVerdict: revealed,
      verdictCls: 'verdict pop d1 ' + (v.ok ? 'ok' : 'no'),
      verdictTitle: v.ok ? 'Godkendt!' : (v.final ? 'Retur — kunden går' : 'Retur til dig!'),
      starsAria: v.stars + ' stjerner',
      earned,
      remark: v.remark,
      verdictSub,
      canRetry: revealed && !v.final,
      canNext: revealed && v.final,
      nextLabel: isLast ? 'Afslut dagen' : 'Næste kunde',
      retry: () => this.retry(),
      next: () => this.next(),
      showCoin: revealed && v.ok,
      coinText: '+' + fmtKr(c.correct ? c.correct.price : 0),

      doneTitle: passed ? (s.timeUp ? 'Fyraften — og dagen er klaret!' : 'Dagen er klaret!') : (s.timeUp ? 'Fyraften! Tiden løb ud' : 'Næsten! Prøv igen'),
      doneQuote: s.doneQuote,
      doneMood: passed ? 'jubel' : 'glad',
      doneBoCls: passed ? 'bo-jump' : 'bo-tilt',
      doneStars: s.dayStars + ' ★',
      doneRecord: s.starRecord && passed ? 'Ny stjerne-rekord: ' + s.dayStars + ' ★ på en dag!' : '',
      doneGoal: goal + ' ★',
      doneMoney: fmtKr(s.dayMoney),
      resultRows: s.results.map(r => ({ navn: r.navn, text: r.missed ? 'Nåede ikke — fyraften!' : r.ok ? (r.tries === 1 ? 'Godkendt i første forsøg' : 'Godkendt efter rettelse') : 'Sendt hjem', stars: r.stars ? '★'.repeat(r.stars) : '–' })),
      donePassed: passed,
      nextDayLabel: s.day >= 5 ? 'Tag på overarbejde' : 'Næste dag',
      nextDay: () => { this.sfx('blip'); this.startDay(s.day + 1, s.money); },
      retryDay: () => { this.sfx('blip'); const m = Math.max(0, s.money - s.dayMoney); this.persist({ money: m, earned: Math.max(0, s.earned - s.dayMoney) }); this.startDay(s.day, m); },
      retryDayCls: passed ? 'btn' : 'btn btn-go btn-big ready'
    };
  }
}

/* ============================================================
   VISNING — skærmene bygges som HTML-tekst og "morphes" ind,
   så elementer og animationer bevares mellem opdateringer.

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
let HANDLERS = [];
function on(fn) { HANDLERS.push(fn); return HANDLERS.length - 1; }

/* Plads-koordinater i rummet (616 × 784) */
const ROOM_SLOTS = {
  H1: [22, 110, 96], H4: [104, 8, 84], H5: [22, 222, 84], H2: [196, -4, 84],
  S1: [20, 368, 76], S2: [346, 368, 76], S3: [440, 368, 76], S4: [526, 368, 76],
  B1: [14, 478, 80], B2: [116, 478, 80], B3: [218, 478, 80], H3: [320, 478, 80], B4: [422, 478, 80], B5: [524, 478, 80],
  D1: [308, 584, 96], D2: [410, 584, 96], D3: [512, 584, 96], D4: [308, 686, 92], D5: [410, 686, 92], D6: [512, 686, 92]
};
function slotHTML(v, k) {
  const sl = v.sl[k];
  if (!sl || !sl.show) return '';
  const p = ROOM_SLOTS[k];
  return `<button class="${sl.cls}" type="button" tabindex="${sl.tab}" data-on="${on(sl.click)}" aria-label="${esc(sl.label)}" data-key="slot-${k}" style="position:absolute;left:${p[0]}px;top:${p[1]}px;width:${p[2]}px;height:${p[2]}px">${sl.has ? pyntSVG(sl.kind, p[2]) : ''}${sl.plus ? ICON.plus : ''}</button>`;
}

function roomHTML(v) {
  const c = v.cust;
  const walls = ['H1', 'H4', 'H5', 'H2'].map(k => slotHTML(v, k)).join('');
  const counter = ['S1', 'S2', 'S3', 'S4', 'B1', 'B2', 'B3', 'H3', 'B4', 'B5'].map(k => slotHTML(v, k)).join('');
  const desk = ['D1', 'D2', 'D3', 'D4', 'D5', 'D6'].map(k => slotHTML(v, k)).join('');
  let pokePop = '';
  if (v.poke && ROOM_SLOTS[v.poke.k]) {
    const pp = ROOM_SLOTS[v.poke.k];
    // Boblen står normalt ovenfor tinget — men nær loftet vender vi den nedad,
    // så den ikke ryger ud over rammen.
    const top = pp[1] > 70 ? Math.max(6, pp[1] - 34) : pp[1] + pp[2] + 8;
    const halfW = Math.max(60, Math.round(v.poke.text.length * 5.2) + 14);
    const left = Math.min(616 - halfW - 6, Math.max(halfW + 6, pp[0] + pp[2] / 2));
    pokePop = `<div class="poke-pop" data-key="poke-${v.poke.n}" style="left:${left}px;top:${top}px">${esc(v.poke.text)}</div>`;
  }
  return `<div class="stage card-stage room-stage" data-w="616" data-h="784"><div class="stage-in" style="width:616px;height:784px">
<div style="position:absolute;left:0;right:0;top:0;height:440px;background:#d3f4f1 repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 46px,rgba(255,255,255,.45) 46px 58px)"></div>

${walls}
${v.isOffice ? `<div class="${v.walkCls}" data-key="cust-${esc(v.contractNo)}" style="position:absolute;left:110px;top:232px;width:200px;height:240px"><div class="bob">${kundeSVG({ shape: c.shape, body: c.body, acc: c.acc, mood: v.custMood }, 200)}</div></div>` : ''}
<div style="position:absolute;left:0;right:0;top:440px;height:24px;background:#ffd84d;border-top:3px solid #1d2b3a;border-bottom:3px solid #1d2b3a"></div>
<div style="position:absolute;left:0;right:0;top:467px;height:100px;background:#c2185b"></div>
${v.isOffice && v.showNamePill ? `<div class="name-pill" data-key="namepill">${esc(c.navn)}</div>` : ''}
${counter}
<div style="position:absolute;left:0;right:0;top:566px;bottom:0;background:#34b8b5 repeating-linear-gradient(0deg,rgba(29,43,58,0) 0 34px,rgba(29,43,58,.08) 34px 37px);border-top:4px solid #1d2b3a"></div>
<div style="position:absolute;left:0;right:0;top:570px;height:10px;background:#a9e8e3"></div>

function eventHTML(v) {
  const ev = v.ev || {};
  let side = '', boMood = 'glad', boCls = 'bo-tilt';
  if (ev.kind === 'gift') {
    const g = ev.gift || {};
    if (ev.phase === 'offer') {
      side = `<div class="lbl">Chef Bo kommer forbi …</div><h2 class="disp h-big">${esc(g.name)}!</h2>

      boMood = 'jubel'; boCls = 'bo-bounce';
    } else {
      side = `<div class="lbl">${ev.phase === 'yes' ? 'Mums!' : 'Nåh …'}</div><h2 class="disp h-big">${ev.phase === 'yes' ? 'Tak for hyggen!' : 'Så spiser Bo den selv'}</h2>

<div><button class="btn btn-go btn-big ready" type="button" data-on="${on(v.eventDone)}">Tilbage til skranken ${ICON.arrow}</button></div>`;
      boMood = ev.phase === 'yes' ? 'jubel' : 'tosset'; boCls = ev.phase === 'yes' ? 'bo-jump' : 'bo-spin';
    }
    return `<main class="screen center-screen" data-key="event-gift">
<div class="card intro-card pop">
<div class="event-art"><div class="${boCls} bo-box" style="transform-origin:50% 100%">${boSVG(boMood)}</div><div class="food pop d1">${foodSVG(g.id, 110)}</div></div>
<div class="stack">${side}</div>
</div>
${ev.phase === 'yes' ? confettiHTML() : ''}
</main>`;
  }
  // møde
  const total = (ev.points || []).length;
  let board, bubble, btn;
  if (ev.phase === 'start') {
    board = `<div class="disp board-title">MØDE — NU!</div><div class="board-sub">Dagsorden: ${total} vigtige punkter</div>`;
    bubble = 'Alle ind i mødelokalet! Det tager kun fem minutter. Cirka. Plus-minus en time.';
    btn = `<button class="btn btn-go btn-big ready" type="button" data-on="${on(v.meetingNext)}">Sæt dig ned (${MEETING_START} min)</button>`;
  } else if (ev.phase === 'point') {
    const pt = ev.points[ev.i];
    board = `<div class="lbl">Punkt ${ev.i + 1} af ${total}</div><div class="disp board-title">${esc(pt[0])}</div>${boardChart(ev.i)}`;
    bubble = pt[1];
    btn = `<button class="btn btn-go btn-big ready" type="button" data-on="${on(v.meetingNext)}">${esc(ev.reply)} (${MEETING_POINT} min)</button>`;
    boMood = ev.i % 2 ? 'hmm' : 'glad';
  } else {
    board = `<div class="disp board-title">Mødet er slut!</div><div class="board-sub">Beslutninger: 0 · Kanelsnegle: 3</div>`;
    bubble = 'Godt møde! Vi mødes igen i morgen og taler om, hvordan det gik i dag.';
    btn = `<button class="btn btn-go btn-big ready" type="button" data-on="${on(v.eventDone)}">Tilbage til skranken ${ICON.arrow}</button>`;
    boMood = 'jubel'; boCls = 'bo-jump';
  }
  return `<main class="screen center-screen" data-key="event-meeting">
<div class="card meeting-card pop">
<div class="whiteboard" data-key="board-${ev.phase}-${ev.i}"><div class="pop">${board}</div></div>
<div class="meeting-bottom">
<div class="${boCls} bo-box small-bo" style="transform-origin:50% 100%">${boSVG(boMood)}</div>
<div class="stack"><div class="bubble boss tail-l ${ev.i % 2 ? 'popB' : 'pop'}" data-key="mb-${ev.phase}-${ev.i}">${esc(bubble)}</div>
<div class="muted-text">Klokken er ${v.clockText}. Kunderne venter …</div>
<div>${btn}</div></div>
</div>
</div>
</main>`;
}

/* ---------- morph: patcher DOM'en i stedet for at erstatte den ---------- */
function keyOf(n) { return n.nodeType === 1 ? n.getAttribute('data-key') : null; }
function morphEl(from, to) {
  const fa = from.attributes;
  for (let i = fa.length - 1; i >= 0; i--) { const n = fa[i].name; if (!to.hasAttribute(n)) from.removeAttribute(n); }
  for (const a of Array.from(to.attributes)) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
  if (from.tagName === 'INPUT') { const val = to.getAttribute('value') || ''; if (from.value !== val) from.value = val; }
  morphChildren(from, to);
}
function morphChildren(from, to) {
  const olds = Array.from(from.childNodes), news = Array.from(to.childNodes);
  const keyed = new Map();
  olds.forEach(n => { const k = keyOf(n); if (k) keyed.set(k, n); });
  const used = new Set();
  let oi = 0;
  news.forEach((nn, i) => {
    let match = null;
    const k = keyOf(nn);
    if (k) {
      const cand = keyed.get(k);
      if (cand && cand.nodeName === nn.nodeName && !used.has(cand)) match = cand;
    } else {
      while (oi < olds.length && (used.has(olds[oi]) || keyOf(olds[oi]))) oi++;
      if (oi < olds.length && olds[oi].nodeType === nn.nodeType && olds[oi].nodeName === nn.nodeName) { match = olds[oi]; oi++; }
    }
    let node;
    if (match) {
      used.add(match);
      if (match.nodeType === 1) morphEl(match, nn);
      else if (match.nodeValue !== nn.nodeValue) match.nodeValue = nn.nodeValue;
      node = match;
    } else node = nn;
    const cur = from.childNodes[i];
    if (cur !== node) from.insertBefore(node, cur || null);
  });
  while (from.childNodes.length > news.length) from.removeChild(from.lastChild);
}

/* ---------- skalering af de tegnede scener ---------- */
function fitStages() {
  document.querySelectorAll('.stage').forEach(st => {
    const w = +st.dataset.w, h = +st.dataset.h;
    const s = st.clientWidth / w;
    const inner = st.firstElementChild;
    if (!inner || !s) return;
    inner.style.transform = 'scale(' + s + ')';
    st.style.height = (h * s) + 'px';
  });
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  Promise.resolve().then(() => { renderQueued = false; render(); });
}

function render() {
  const v = game.renderVals();
  HANDLERS = [];
  let body;
  if (v.isTitle) body = titleHTML(v);
  else if (v.isIntro) body = introHTML(v);
  else if (v.showRoom) body = officeHTML(v);
  else if (v.isReview) body = reviewHTML(v);
  else if (v.isDone) body = doneHTML(v);
  else if (v.isEvent) body = eventHTML(v);
  else if (v.isShop) body = shopHTML(v);
  else body = titleHTML(v);
  const tpl = document.createElement('template');
  tpl.innerHTML = `<div id="app" class="app">${headerHTML(v)}${body}</div>`;
  const app = document.getElementById('app');
  const prevScreen = app.getAttribute('data-screen');
  morphEl(app, tpl.content.firstElementChild);
  app.setAttribute('data-screen', game.state.screen);
  fitStages();
  if (prevScreen && prevScreen !== game.state.screen) window.scrollTo(0, 0);
}

/* ---------- træk og slip (indretning) ---------- */
let drag = null, dragEndedAt = 0;
function dragScale() {
  const st = document.querySelector('.room-stage');
  return st && st.clientWidth ? st.clientWidth / 616 : 1;
}
function dragCleanup(d) {
  if (d.ghost) d.ghost.remove();
  if (d.srcEl) d.srcEl.classList.remove('dragging-src');
  if (d.hl) d.hl.classList.remove('dragok', 'dragbad');
}
document.addEventListener('pointerdown', e => {
  if (!e.isPrimary || drag) return;
  if (game.state.screen !== 'decorate') return;
  let id = null, fromSlot = null, srcEl = null;
  const slotBtn = e.target.closest && e.target.closest('button.slot');
  if (slotBtn) {
    fromSlot = slotBtn.getAttribute('data-key').slice(5);
    id = game.state.place[fromSlot];
    if (id) srcEl = slotBtn;
  } else {
    const invBtn = e.target.closest && e.target.closest('.inv-grid button');
    if (invBtn) { id = invBtn.getAttribute('data-key').slice(4); srcEl = invBtn; }
  }
  if (!id || !srcEl) return;
  drag = { id, fromSlot, srcEl, x0: e.clientX, y0: e.clientY, active: false, ghost: null, hl: null, size: 0 };
});
document.addEventListener('pointermove', e => {
  if (!drag || !e.isPrimary) return;
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 12) return;
    const svg = drag.srcEl.querySelector('svg.pynt');
    if (!svg) { drag.active = false; return; }
    drag.size = Math.round((drag.fromSlot ? ROOM_SLOTS[drag.fromSlot][2] : 60) * Math.max(.75, dragScale()));
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    const c = svg.cloneNode(true);
    c.setAttribute('width', drag.size);
    c.setAttribute('height', drag.size);
    c.style.display = 'block';
    g.appendChild(c);
    document.body.appendChild(g);
    drag.active = true;
    drag.ghost = g;
    drag.srcEl.classList.add('dragging-src');
  }
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top = e.clientY + 'px';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const slot = el && el.closest ? el.closest('button.slot') : null;
  if (drag.hl && drag.hl !== slot) drag.hl.classList.remove('dragok', 'dragbad');
  if (slot) {
    const k = slot.getAttribute('data-key').slice(5);
    slot.classList.add(fits(drag.id, k) ? 'dragok' : 'dragbad');
    drag.hl = slot;
  } else drag.hl = null;
});
function dragDrop(e) {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (!d.active) return;
  dragEndedAt = Date.now();
  dragCleanup(d);
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const slot = el && el.closest ? el.closest('button.slot') : null;
  if (slot) {
    game.placeItem(d.id, slot.getAttribute('data-key').slice(5));
  } else if (el && el.closest && (el.closest('.inv-grid') || el.closest('[data-key="store"]'))) {
    game.storeItem(d.id);
  } else {
    game.sfx('blip');
    game.setState({ decoMsg: 'Drag den til en plads i rummet — eller til lageret til højre.' });
  }
}
document.addEventListener('pointerup', dragDrop);
document.addEventListener('pointercancel', e => {
  if (!drag) return;
  if (drag.active) { dragEndedAt = Date.now(); dragCleanup(drag); }
  drag = null;
});
document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });

/* ---------- hændelser ---------- */
document.addEventListener('click', e => {
  if (Date.now() - dragEndedAt < 500) return;
  const el = e.target.closest('[data-on]');
  if (!el || el.disabled) return;
  const fn = HANDLERS[+el.getAttribute('data-on')];
  if (fn) fn(e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-oninput]');
  if (!el) return;
  const fn = HANDLERS[+el.getAttribute('data-oninput')];
  if (fn) fn(e);
});
document.addEventListener('keydown', e => {
  const el = e.target.closest && e.target.closest('[data-onkey]');
  if (!el) return;
  const fn = HANDLERS[+el.getAttribute('data-onkey')];
  if (fn) fn(e);
});
window.addEventListener('resize', fitStages);

const game = new Component({});
render();

</script>
